name: Publish

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write # provenance do npm

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # A tag (vX.Y.Z) precisa bater com a versão do core-kernel no package.json.
      - name: Tag confere com o package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME não corresponde à versão $VERSION do package.json"
            exit 1
          fi

      - run: bun install --frozen-lockfile
      - run: bun run verify
      # changeset publish publica cada pacote do repositório (core-kernel e core-kernel-check)
      # cuja versão ainda não está no registro, via npm (que gera o atestado de provenance).
      # Em prerelease (.changeset/pre.json), usa a dist-tag do modo pre, nunca latest.
      # Os scripts do pacote ficam desligados: o verify já rodou acima.
      - run: ./node_modules/.bin/changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
          npm_config_ignore_scripts: "true"
