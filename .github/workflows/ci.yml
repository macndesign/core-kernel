name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test:coverage
      - run: bun run build
      - run: bun run check:package
      - run: bun run check:examples
      - run: bun run check:checker
      - run: bun run check:skills
      # Valida o plugin do Claude Code a partir do tarball do npm.
      - run: npm install -g @anthropic-ai/claude-code
      - run: bun run check:plugin
      # Tipos publicados funcionam para consumidores com o TypeScript mínimo suportado.
      - run: bun run check:ts-compat
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  # Garante que o pacote publicado roda em todas as versões de Node suportadas.
  node-compat:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/smoke.mjs
      - run: node scripts/smoke.cjs
      - run: node scripts/smoke-cli.mjs
